root /usr/share/nginx/html;
index index.html;
server_tokens off;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

include /etc/texlyre/nginx/typesetter.conf;

location = /healthz {
	access_log off;
	default_type text/plain;
	return 200 "ok\n";
}

# The Vite build uses this base path. Keep the trailing slash so relative PWA
# URLs, the service worker, and static assets resolve correctly.
location = / {
	return 302 /texlyre/;
}

location = /texlyre {
	return 308 /texlyre/;
}

location = /texlyre/index.html {
	add_header Cache-Control "no-cache" always;
	rewrite ^ /index.html break;
	try_files $uri =404;
}

location = /texlyre/sw.js {
	add_header Cache-Control "no-cache" always;
	rewrite ^ /sw.js break;
	try_files $uri =404;
}

# PDF.js loads its worker as an ES module. The stock Nginx MIME table does
# not include .mjs, so set a module-compatible fallback without replacing the
# inherited MIME mappings used for HTML, CSS, fonts, and other assets.
location ~ ^/texlyre/.*\.mjs$ {
	default_type application/javascript;
	rewrite ^/texlyre/(.*)$ /$1 break;
	try_files $uri =404;
}

# Fall back to the application shell for browser-side routes while returning
# 404 for missing static assets that explicitly have a file extension.
location ~ ^/texlyre/.*\.[^/]+$ {
	rewrite ^/texlyre/(.*)$ /$1 break;
	try_files $uri =404;
}

location /texlyre/ {
	rewrite ^/texlyre/(.*)$ /$1 break;
	try_files $uri $uri/ /texlyre/index.html;
}
